<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>RANDSA — Rent, list, and book anything</title>
    <meta
      name="description"
      content="RANDSA is one marketplace to discover, list, book, and manage rentals — homes, offices, cars, event spaces, and more. Verified listings and a clear booking flow."
    />

    <!-- Browser chrome follows the active theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e13" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RANDSA" />

    <!-- Link previews when a listing is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RANDSA" />
    <meta property="og:title" content="RANDSA — Rent, list, and book anything" />
    <meta
      property="og:description"
      content="One marketplace to discover, list, book, and manage rentals — homes, offices, cars, event spaces, and more."
    />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RANDSA — Rent, list, and book anything" />
    <meta
      name="twitter:description"
      content="One marketplace to discover, list, book, and manage rentals."
    />
    <meta name="twitter:image" content="/og-cover.jpg" />

    <!-- Two families only: Fraunces for editorial display, Manrope for UI text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!--
      Applied before first paint so a dark-theme user never sees a light flash.
      Mirrors the logic in src/composables/useTheme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('randsa-theme')
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* Default light theme is fine when storage is unavailable. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
